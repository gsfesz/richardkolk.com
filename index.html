<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello richard!!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
        }

        /* ── Background layer ── */
        #bg-layer {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
        }

        .bg-item {
            position: absolute;
            user-select: none;
        }

        .bg-item img {
            display: block;
        }

        /* Geese: wrapper translates left → right */
        @keyframes fly-right {
            from { transform: translateX(-300px); }
            to   { transform: translateX(calc(100vw + 300px)); }
        }

        /* Jets: wrapper translates right → left */
        @keyframes fly-left {
            from { transform: translateX(calc(100vw + 300px)); }
            to   { transform: translateX(-300px); }
        }

        /* Flags: drift upward and fade out */
        @keyframes float-up {
            0%   { transform: translateY(0)      rotate(-4deg); opacity: 1;   }
            50%  { transform: translateY(-45vh)  rotate(4deg);  opacity: 0.9; }
            100% { transform: translateY(-115vh) rotate(-2deg); opacity: 0;   }
        }

        /* ── Main card ── */
        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 520px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 40px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.3s;
        }

        button:active { transform: scale(0.95); }

        .yes { background-color: #4CAF50; color: white; }
        .yes:hover { background-color: #45a049; }

        .no { background-color: #f44336; color: white; }
        .no:hover { background-color: #da190b; }

        /* ── Meter ── */
        .meter-section { margin-top: 10px; }

        .meter-label {
            font-size: 1em;
            font-weight: 600;
            color: #555;
            margin-bottom: 12px;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .meter-wrap {
            position: relative;
            width: 100%;
            height: 48px;
            background: #eee;
            border-radius: 24px;
            overflow: hidden;
            border: 3px solid #ccc;
            box-shadow: inset 0 3px 8px rgba(0,0,0,0.15);
        }

        .meter-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f44336 0%, #ff9800 40%, #ffeb3b 65%, #4CAF50 100%);
            background-size: 520px 100%;
            border-radius: 24px;
            transition: width 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        .meter-fill::after {
            content: '';
            position: absolute;
            top: 4px;
            left: 8px;
            right: 8px;
            height: 40%;
            background: rgba(255,255,255,0.3);
            border-radius: 10px;
        }

        .meter-needle {
            position: absolute;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 6px;
            height: 60px;
            background: #222;
            border-radius: 3px;
            transition: left 0.8s cubic-bezier(0.34, 1.56, 0.64, 1);
            left: 0%;
            z-index: 2;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
        }

        .meter-ends {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 0.8em;
            font-weight: 700;
        }

        .meter-ends .end-no  { color: #f44336; }
        .meter-ends .end-yes { color: #4CAF50; }

        .verdict {
            margin-top: 20px;
            font-size: 1.4em;
            font-weight: 700;
            min-height: 1.8em;
            transition: color 0.5s;
        }

        .vote-tally {
            margin-top: 10px;
            font-size: 0.9em;
            color: #aaa;
        }

        /* ── Food Journal ── */
        .food-journal {
            margin-top: 36px;
            text-align: left;
            border-top: 2px dashed #eee;
            padding-top: 24px;
        }

        .food-journal h2 {
            font-size: 1.1em;
            color: #555;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .food-journal ul {
            list-style: none;
            padding: 0;
        }

        .food-journal ul li {
            padding: 8px 12px;
            margin-bottom: 6px;
            background: #f9f9f9;
            border-radius: 6px;
            border-left: 4px solid #ff9800;
            font-size: 1em;
            color: #333;
        }
    </style>
</head>
<body>

    <div id="bg-layer"></div>

    <div class="container">
        <h1>Will Richard be off work?</h1>
        <div class="buttons">
            <button class="yes" onclick="vote('yes')">Yes</button>
            <button class="no" onclick="vote('no')">No</button>
        </div>

        <div class="meter-section">
            <div class="meter-label">Richard-o-meter</div>
            <div class="meter-wrap">
                <div class="meter-fill" id="meter-fill"></div>
                <div class="meter-needle" id="meter-needle"></div>
            </div>
            <div class="meter-ends">
                <span class="end-no">Chained to desk</span>
                <span class="end-yes">FREE AT LAST</span>
            </div>
            <div class="verdict" id="verdict"></div>
            <div class="vote-tally" id="tally"></div>
        </div>

        <div class="food-journal">
            <h2>Richard's Food Journal (for his doctor)</h2>
            <ul>
                <li>Wendy's</li>
                <li>Jimmy Johns</li>
                <li>Yorktown</li>
                <li>McDonald's</li>
            </ul>
        </div>
    </div>

    <script>
        // ── Voting ────────────────────────────────────────────────
        let votes = JSON.parse(localStorage.getItem('votes')) || { yes: 0, no: 0 };

        const verdicts = [
            { threshold: 0,  text: "No data. Assume he's working.",         color: "#f44336" },
            { threshold: 10, text: "Almost certainly at his desk. Sorry.",  color: "#e53935" },
            { threshold: 25, text: "Outlook: bleak. Very bleak.",           color: "#ff7043" },
            { threshold: 40, text: "Signs of hope. Very faint signs.",      color: "#ff9800" },
            { threshold: 55, text: "Could go either way. Classic Richard.", color: "#ffc107" },
            { threshold: 70, text: "Looking promising!",                    color: "#8bc34a" },
            { threshold: 85, text: "Almost certainly free! Celebrate!",     color: "#4CAF50" },
            { threshold: 95, text: "HE'S OFF. PARTY TIME.",                 color: "#2e7d32" },
        ];

        function getVerdict(pct) {
            let result = verdicts[0];
            for (const v of verdicts) { if (pct >= v.threshold) result = v; }
            return result;
        }

        function updateDisplay() {
            const total = votes.yes + votes.no;
            const pct = total === 0 ? 0 : Math.round((votes.yes / total) * 100);
            document.getElementById('meter-fill').style.width = pct + '%';
            document.getElementById('meter-needle').style.left = pct + '%';
            const v = getVerdict(pct);
            const verdictEl = document.getElementById('verdict');
            verdictEl.textContent = v.text;
            verdictEl.style.color = v.color;
            document.getElementById('tally').textContent =
                total === 0
                    ? 'No votes yet — be the first!'
                    : `${votes.yes} yes · ${votes.no} no · ${pct}% freedom`;
        }

        function vote(option) {
            votes[option]++;
            localStorage.setItem('votes', JSON.stringify(votes));
            updateDisplay();
        }

        updateDisplay();

        // ── Background critters ───────────────────────────────────
        const bg = document.getElementById('bg-layer');
        function rand(min, max) { return Math.random() * (max - min) + min; }

        function spawnGoose() {
            const wrapper = document.createElement('div');
            wrapper.className = 'bg-item';
            const duration = rand(12, 20);
            const top      = rand(5, 88);
            wrapper.style.cssText = `top:${top}vh; animation:fly-right ${duration}s linear forwards;`;

            const img = document.createElement('img');
            img.src = 'goose.png';
            img.style.cssText = `width:${rand(80, 160)}px; transform:rotate(-30deg);`;

            wrapper.appendChild(img);
            bg.appendChild(wrapper);
            wrapper.addEventListener('animationend', () => wrapper.remove());
        }

        function spawnJet() {
            const wrapper = document.createElement('div');
            wrapper.className = 'bg-item';
            const duration = rand(5, 9);
            const top      = rand(5, 82);
            wrapper.style.cssText = `top:${top}vh; animation:fly-left ${duration}s linear forwards;`;

            const img = document.createElement('img');
            img.src = 'jet.png';
            img.style.cssText = `width:${rand(130, 240)}px; transform:scaleX(-1);`;

            wrapper.appendChild(img);
            bg.appendChild(wrapper);
            wrapper.addEventListener('animationend', () => wrapper.remove());
        }

        function spawnFlag() {
            const wrapper = document.createElement('div');
            wrapper.className = 'bg-item';
            const duration = rand(10, 18);
            const left     = rand(2, 93);
            wrapper.style.cssText = `bottom:-160px; left:${left}vw; animation:float-up ${duration}s ease-in forwards;`;

            const img = document.createElement('img');
            img.src = 'flag.png';
            img.style.cssText = `width:${rand(90, 160)}px;`;

            wrapper.appendChild(img);
            bg.appendChild(wrapper);
            wrapper.addEventListener('animationend', () => wrapper.remove());
        }

        // Spawn rates — staggered so page doesn't explode on load
        function scheduleGoose() { spawnGoose(); setTimeout(scheduleGoose, rand(1800, 3500)); }
        function scheduleJet()   { spawnJet();   setTimeout(scheduleJet,   rand(2500, 5500)); }
        function scheduleFlag()  { spawnFlag();  setTimeout(scheduleFlag,  rand(1000, 2500)); }

        scheduleGoose();
        setTimeout(scheduleJet,  800);
        setTimeout(scheduleFlag, 400);

        // Seed a few extras immediately so the page isn't empty on first load
        for (let i = 0; i < 3; i++) setTimeout(spawnGoose, i * 600);
        for (let i = 0; i < 2; i++) setTimeout(spawnJet,   i * 1200);
        for (let i = 0; i < 4; i++) setTimeout(spawnFlag,  i * 400);
    </script>
</body>
</html>
