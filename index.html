<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello richard!!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            text-align: center;
            background: white;
            padding: 60px 40px;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: #333;
            font-size: 2.5em;
            margin-bottom: 30px;
        }

        .buttons {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 30px;
            font-size: 1.2em;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .yes {
            background-color: #4CAF50;
            color: white;
        }

        .yes:hover {
            background-color: #45a049;
        }

        .no {
            background-color: #f44336;
            color: white;
        }

        .no:hover {
            background-color: #da190b;
        }

        .results {
            font-size: 1.2em;
            color: #666;
        }

        .results p {
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Will Richard be off work?</h1>
        <div class="buttons">
            <button class="yes" onclick="vote('yes')">Yes</button>
            <button class="no" onclick="vote('no')">No</button>
        </div>
        <div class="results">
            <p>Yes votes: <span id="yes-count">0</span></p>
            <p>No votes: <span id="no-count">0</span></p>
        </div>
    </div>

    <script>
        let votes = JSON.parse(localStorage.getItem('votes')) || { yes: 0, no: 0 };

        function updateDisplay() {
            document.getElementById('yes-count').textContent = votes.yes;
            document.getElementById('no-count').textContent = votes.no;
        }

        function vote(option) {
            votes[option]++;
            localStorage.setItem('votes', JSON.stringify(votes));
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
